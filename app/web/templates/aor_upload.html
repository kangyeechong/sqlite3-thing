{% extends "base.html" %}
{% block title %}{{ t("aor_upload.heading") }}{% endblock %}
{% block content %}
  <h1>{{ t("aor_upload.heading") }}</h1>
  <p class="muted">{{ t("aor_upload.help") }}</p>
  <p class="muted">{{ t("aor_upload.master_instead_lead") }} <a href="{{ url_for('web.upload') }}">{{ t("upload.heading") }}</a>.</p>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <p class="muted">{{ t("aor_upload.period_help") }}</p>
    <label>{{ t("form.period_start") }}
      <input type="date" name="period_start" required>
    </label>
    <label>{{ t("form.period_end") }}
      <input type="date" name="period_end" required>
    </label>
    <label>{{ t("aor_upload.file_label") }}
      <input type="file" name="report_file" accept=".xlsx" required>
    </label>
    <button class="button" type="submit">{{ t("action.process_upload") }}</button>
  </form>
{% endblock %}
