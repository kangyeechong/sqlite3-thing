{% extends "base.html" %}
{% block title %}{{ t("agency_edit.heading") }}{% endblock %}
{% block content %}
  <h1>{{ t("agency_edit.heading") }}</h1>
  <p class="muted">{{ t("agency_edit.help") }}</p>
  <form method="post" action="{{ url_for('web.edit_agency', agency_code=agency.agency_code) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ t("form.agency_code") }}
      <input type="text" name="agency_code" value="{{ agency.agency_code }}" required>
    </label>
    <label>{{ t("form.name") }}
      <input type="text" name="name" value="{{ agency.name or '' }}" required>
    </label>
    <label>{{ t("form.format") }}
      <select name="format_key" required>
        {% for key, fmt in agency_formats.items() %}
          <option value="{{ key }}"{% if key == current_format_key %} selected{% endif %}>{{ fmt.label }}</option>
        {% endfor %}
      </select>
    </label>
    <button class="button" type="submit">{{ t("action.save") }}</button>
  </form>

  <p><a href="{{ url_for('web.agencies') }}">{{ t("action.back_to_agencies") }}</a></p>
{% endblock %}
