{% extends "base.html" %}
{% block title %}{{ t("upload.heading") }}{% endblock %}
{% block content %}
  <h1>{{ t("upload.heading") }}</h1>
  <p class="muted">{{ t("upload.help") }}</p>
  <p class="muted">{{ t("upload.aor_instead_lead") }} <a href="{{ url_for('web.upload_aor') }}">{{ t("upload.aor_link_text") }}</a>.</p>
  <form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>{{ t("upload.file_label") }}
      <input type="file" name="report_file" accept=".xlsx" required>
    </label>
    <button class="button" type="submit">{{ t("action.process_upload") }}</button>
  </form>
{% endblock %}
